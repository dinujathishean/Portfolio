<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d12" />
      <stop offset="100%" stop-color="#030608" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9f" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,159,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="url(#bg)" />
  <rect width="900" height="900" fill="url(#grid)" />

  <circle cx="450" cy="370" r="140" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.7" />
  <circle cx="450" cy="370" r="148" fill="none" stroke="rgba(0,255,159,0.15)" stroke-width="1" stroke-dasharray="8 6" />
  <path
    d="M 260 760 C 290 640 360 580 450 580 C 540 580 610 640 640 760"
    fill="none"
    stroke="url(#accent)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.7"
  />

  <text x="450" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600" fill="#00ff9f">
    [ PROFILE_IMG ]
  </text>
  <text x="450" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#5a7268">
    awaiting upload...
  </text>
</svg>
